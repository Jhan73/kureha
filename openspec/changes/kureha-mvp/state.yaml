    status: complete   # CORREGIDO 2026-07-12 (sdd-tasks): el conteo "11 specs" era incorrecto — hay 14 archivos spec.md reales en openspec/changes/kureha-mvp/specs/ (verificado via glob), no existe openspec/specs/ base preexistente (proyecto greenfield), asi que las 14 son archivos nuevos de este change. 6 nuevas (user-authentication, session-management, platform-hardening, patient-self-service-portal, staff-registry, staff-scheduling) + 8 que extienden conceptualmente specs ya nombradas en el proposal original del curso pero cuyo archivo tambien se crea aca (access-control, action-based-rbac, consent-and-audit, clinical-safety, appointment-scheduling, embedded-patient-chat, internal-staff-copilot, google-calendar-sync). Incluye la experiencia conversacional (Tony) en las 4 specs afectadas + baseline de confirmacion conversacional pre-mutacion en los dos canales de chat.
    note: >
      Extension en sitio (post experiencia Tony): embedded-patient-chat e
      internal-staff-copilot suman cada uno el requisito "Confirmation
      Required Before Any Mutating Action" — un piso a nivel de canal: Tony/el
      copilot SIEMPRE debe presentar la accion mutante en lenguaje simple y
      obtener confirmacion explicita del usuario ANTES de ejecutar cualquier
      create/update/delete originado por intent conversacional, incluyendo
      mutaciones simples y no-bulk que HOY NO disparan HITL (p.ej. reservar
      una cita con el profesional originalmente solicitado). Este piso es
      deliberadamente MAS LIVIANO que el Human-in-the-Loop de
      `clinical-safety`: se resuelve en la misma conversacion (mismo turno o
      el siguiente) directamente con el usuario que pidio la accion, sin
      pausar hacia un aprobador staff separado — se compone con el streaming
      ya especificado (el prompt de confirmacion viaja dentro de la respuesta
      streameada; la ejecucion espera el siguiente turno del usuario). Es
      capa adicional sobre los triggers de HITL existentes (cancelacion
      masiva, reasignacion de profesional, accion tenant-configurada), no un
      reemplazo. Se agrego tambien una nota breve de cross-referencia en
      `clinical-safety` distinguiendo explicitamente ambos mecanismos, para
      que un lector de esa spec por si sola no confunda "pedir confirmacion
      al usuario" con "pausar y enrutar a un aprobador staff".
      3 specs nuevas (user-authentication, session-management,
      platform-hardening) + 4 specs existentes extendidas EN SITIO (no
      reescritas): access-control tiene el requisito "Session Claims
      Originate From Authenticated Identity" (el request_ctx nace de
      AuthPort); action-based-rbac tiene "Permission Cache Invalidation Is a
      Security Control" como MUST duro (cache de permiso stale tras revoke =
      privilege escalation, no performance); google-calendar-sync tiene
      "Idempotent Sync Retries" (event id deterministico via appointment_id,
      retry hace upsert no insert); consent-and-audit tiene "Hash-Chain
      Integrity Monitoring and Alerting" (alarma de tamper + dead-man's
      switch, ya no falla en silencio).
      Judgment call registrado: session-management fija el bound de
      propagacion de cambio de rol/permiso como NEXT-REQUEST (chequeo vivo de
      `active` por request) para el escenario critico de staff desactivado —
      no max-TTL — porque el proposal ya resuelve esa tension explicitamente
      (access tokens cortos + chequeo vivo); cambios de rol/permiso que NO
      tocan `active` quedan acotados por el TTL corto del access token como
      bound secundario. user-authentication deja el vendor de IdP fuera (ya
      decidido en proposal/design) y solo fija requisitos que cualquier
      integracion de IdP debe cumplir, con el escenario explicito de
      separacion Google-login vs Google-Calendar-OAuth.
      Experiencia conversacional (Tony) incorporada en las 4 specs afectadas:
      embedded-patient-chat suma identidad + auto-descripcion de capacidades
      ("Assistant Identity and Capability Self-Disclosure"), memoria de corto
      plazo efimera por thread_id retenido SOLO en memoria del cliente sobre
      el PostgresSaver de ADR-7 ("Ephemeral Short-Term Memory Scoped to a
      Client-Held Thread ID", con escenario explicito de que el refresh corta
      la continuidad del chat pero NO cierra la sesion de auth), streaming con
      visibilidad de estado/eventos y respuestas en Markdown.
      internal-staff-copilot suma el mismo streaming+eventos y Markdown,
      con el requisito adicional de que los eventos intermedios no filtren
      nombres de tool ni resultados parciales fuera del RBAC del usuario
      (ni siquiera transitoriamente durante el streaming).
      clinical-safety suma "Guardrail Enforcement on Both Input and Output"
      (la linea recomienda/orienta-nunca-diagnostica se hace cumplir tanto en
      lo que el usuario envia -incluye resistencia a prompt injection/
      jailbreak- como en lo que el agente emite, con chequeo de salida
      independiente del de entrada) y "Tenant and Scope Leakage Prevention via
      Chat" (defensa en profundidad a nivel de conversacion, no reemplaza RLS
      de role-based-rls). platform-hardening suma "Descriptive, Non-Leaky
      Error Taxonomy" (auth, validacion, calendar-sync degradado, HITL
      pendiente, scope clinico rechazado, rate-limited -> mensajes especificos
      sin stack traces/secretos/detalles de infra).
      Judgment calls de esta ronda: el limite refresh-corta-chat-pero-no-auth
      se declaro explicito con su propio escenario para no confundirse con
      session-management (el thread_id de continuidad de chat es un concepto
      distinto del token de sesion); el guardrail de salida en clinical-safety
      se especifico como chequeo independiente del de entrada (no solo un
      fallback) para que una injection que evada el filtro de entrada igual
      quede bloqueada antes de llegar al usuario; la taxonomia de errores tomo
      literalmente la lista de categorias del proposal como el minimo
      exigido, dejando la lista de codigos concretos para sdd-design.
