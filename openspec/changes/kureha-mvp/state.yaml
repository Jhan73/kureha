scope_note: >
  Kureha es una PLATAFORMA OPERATIVA de la clinica. In-scope MVP: multi-tenant
  (tenant_id sobre sede_id), portal de autoservicio del paciente (web + chat
  embebido), Google Calendar sync (best-effort tras CalendarSyncPort, OAuth2
  por paciente — no bloqueante), gestion operativa de personal (registro +
  horarios/turnos, NO HR completo), RBAC por accion (configurable por clinica,
  chequeos action-level), copilot interno de staff (toolset segun permisos de
  accion), chat que recomienda y orienta administrativamente. Sobre ese
  dominio operativo se agregan siete concerns de plataforma/infra que la
  gobernanza de dato clinico exige, todos detras del patron "puerto" ya
  establecido: (1) AUTENTICACION DE USUARIO / login — nuevo AuthPort,
  email+password Y "Sign in with Google" (federado, DISTINTO del OAuth de
  Calendar); recomendacion validada: IdP externo gestionado (Supabase Auth
  mejor fit por Postgres+RLS; Auth0/Clerk viables), authn en el IdP, authz
  (tenant_id/site_id/role -> GUCs) retenido en Kureha; (2) GESTION DE SESION —
  expiry/refresh/logout/revocacion + cambio de rol a mitad de sesion (token de
  vida corta + chequeo vivo de active por request); (3) CAPA DE CACHE —
  disponibilidad, resolucion RBAC y tools del copilot, tenant-scoped,
  invalidacion correcta ante cambio de permiso (decision SEPARADA de ADR-7,
  que solo rechazo Redis para el checkpointer); (4) RATE LIMITING — endpoints
  de auth y de chat del paciente; (5) IDEMPOTENCY KEYS en el sync de Calendar
  (reintento no duplica evento); (6) OBSERVABILIDAD/ALERTING del hash-chain de
  auditoria (alarma de tamper + dead-man's switch); (7) DESPLIEGUE AWS como
  constraint de MVP ("seguro pero sin overkill": red privada, secret manager
  para la KEK de ADR-12, TLS, IAM least-privilege) — requisito y constraints,
  NO topologia (eso es design). Specs nuevas: user-authentication,
  session-management, platform-hardening. Specs extendidas: access-control,
  action-based-rbac, google-calendar-sync, consent-and-audit, y el design
  (stack table, 4.2, 4.3, 5, 7 + ADR-14..ADR-20). El nucleo de gobernanza
  (RLS, consent, audit append-only, HITL, scope clinico) se preserva intacto
  a lo largo de todo el dominio. El chat de paciente y el copilot de staff se
  entregan a traves de un unico asistente conversacional, TONY, con requisitos
  de experiencia in-scope de MVP: auto-descripcion de capacidades (recomienda/
  orienta administrativamente, nunca diagnostica); memoria de corto plazo
  efimera por sesion (thread_id generado y retenido SOLO en memoria del cliente
  sobre el PostgresSaver de ADR-7, se limpia al refrescar — el frontend nunca
  persiste el thread_id; el checkpoint previo queda en Postgres solo para
  auditoria; sin Redis ni store nuevo); respuestas en streaming con visibilidad
  de estado/eventos; manejo de errores descriptivo con taxonomia no-filtrante
  (validacion, auth, calendar-sync degradado, HITL pendiente, scope rechazado,
  rate-limited); guardrails de chat de entrada+salida (resistencia a
  injection/jailbreak, anti-fuga tenant/scope, proporcionado a MVP); y salida
  en Markdown. La topologia AWS incorpora ademas un FRONTEND TIER explicito
  (SPA estatica separada del backend, direccion S3+CloudFront, sin nuevo
  compute) y dos decisiones deliberadas: SIN API Gateway en MVP (ALB+WAF ya
  cubre TLS/routing/rate limiting; trigger de upgrade: API publica
  partner-facing con API keys/quotas por cliente) y SIN Redis (refuerza ADR-16;
  la memoria de Tony la cubre el PostgresSaver). Specs afectadas por esta
  experiencia conversacional ya completas: embedded-patient-chat,
  internal-staff-copilot, clinical-safety, platform-hardening (taxonomia de
  errores). El frontend tier / sin API Gateway / sin Redis quedan como
  concern de design (§8, §8.2/8.3, §20, ADR-16), pendiente de re-derivacion.
  Fuera de MVP (V2, tras puerto con stub): Telegram, WaitlistAgent, export
  FHIR/RENHICE, panel de gobernanza, HR completo (nomina/contratos/desempeño).
