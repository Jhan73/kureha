    note: >
      Design derivado contra el proposal y las 11 specs (3 nuevas + 4
      extendidas). Secciones actualizadas IN-SITU: §1 stack table (+IdP/
      AuthPort, tokens de sesion, cache, rate limiter, Secrets Manager,
      runtime Fargate/RDS); §4.2 (origen del contexto desde identidad
      autenticada + GATE de estado activo vivo per-request como hook del
      next-request bound); §4.3 (alerting de tamper por CloudWatch
      metric+SNS + dead-man's switch treatMissingData=breaching); §4.4
      (+columna calendar_sync.idempotency_key, +tablas user_sessions y
      rate_counters); §5.6 (cache de RBAC: NO cross-request, addendum a
      ADR-10); §7.4 (KEK atada a AWS Secrets Manager) + §7.6 (idempotencia
      por event id determinista, 409=exito). Secciones nuevas: §17 (AuthPort
      + ciclo de sesion), §18 (estrategia de cache), §19 (rate limiting),
      §20 (topologia AWS con diagrama mermaid + why-not-X table + triggers
      de upgrade). ADRs: ADR-14 (Supabase Auth standalone tras AuthPort, RDS
      se queda en AWS — NO migra a Supabase; auth.uid() no aplica porque
      Kureha usa RLS por GUC), ADR-15 (Kureha acuña access JWT corto ~10min
      + refresh opaco en user_sessions; IdP solo autentica en login), ADR-16
      (SIN cache compartido: RBAC vivo sin ventana stale por construccion,
      disponibilidad per-instance TTL; Redis = upgrade documentado), ADR-17
      (rate limiting 3 capas WAF+IdP+app sobre Postgres/per-instance, sin
      ElastiCache), ADR-18 (idempotencia Calendar via client-supplied
      deterministic event id derivado de appointment_id), ADR-19 (monitoreo
      hash-chain CloudWatch), ADR-20 (baseline AWS Fargate+ALB+WAF+RDS-
      Single-AZ+1NAT+Secrets Manager+IAM least-privilege, region/VPC unica).
      Tension AWS-vs-Supabase resuelta explicitamente: solo auth flows salen
      a Supabase, dato clinico jamas sale de RDS/VPC. El nucleo de
      gobernanza (RLS, consent, audit, HITL, scope, ADR-1..ADR-13) queda
      intacto.
      Refinamientos de experiencia conversacional a re-derivar en el design:
      §8 (grafo/estado) formaliza el streaming con visibilidad de eventos
      sobre el streaming nativo del grafo y la memoria de corto plazo efimera
      via PostgresSaver keyed por thread_id (ADR-7), con el thread_id generado
      y retenido en memoria del cliente (nunca persistido en el frontend);
      §8.2/§8.3 formalizan los guardrails de chat entrada+salida (resistencia
      a injection/jailbreak, anti-fuga tenant/scope) como refuerzo del
      response_guard de scope outbound, con RLS/RBAC como piso duro; §20
      incorpora un frontend tier explicito (SPA estatica separada, direccion
      S3+CloudFront) y las decisiones deliberadas SIN API Gateway (ALB+WAF ya
      cubre TLS/routing/rate limiting; trigger de upgrade: API publica
      partner-facing con API keys/quotas por cliente) y SIN Redis (refuerza
      ADR-16; la memoria de Tony la cubre el PostgresSaver, no un cache nuevo),
      con el diagrama a actualizar para modelar el frontend tier. La taxonomia
      de errores no-filtrantes se ata a las specs afectadas. Ninguna pieza de
      infraestructura nueva: todo se apoya en lo ya decidido.
