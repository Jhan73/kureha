schema: spec-driven

project: Kureha
description: >
  Plataforma operativa multi-tenant para clinicas y consultorios en Peru:
  agenda, autoservicio del paciente, sincronizacion con Google Calendar,
  gestion operativa de personal y copilot interno, disenada desde el inicio
  para ser segura, auditable y con gobernanza sobre datos de salud (dato
  sensible bajo Ley 29733).

context: |
  Tech stack: Scaffolding inicial creado, sin logica de negocio todavia.
  backend/: Python 3.13 via uv, pyproject.toml con dependencies=[] (aun sin
  LangChain/LangGraph/FastAPI instalados). frontend/: Next.js 16.2 + React
  19.2 + TypeScript + Tailwind 4 via create-next-app (App Router, sin paginas
  propias todavia). Stack previsto segun el curso base sigue siendo: Python
  3.13+, LangChain, LangGraph (patron supervisor + especialistas + HITL),
  PostgreSQL con Row-Level Security, FastAPI + JWT. Confirmar/ajustar en fase
  de design, no asumir sin validar.

  Architecture: A definir en sdd-design. Candidatos a evaluar: arquitectura
  hexagonal/screaming architecture para aislar el dominio clinico (agenda,
  consentimiento, auditoria) de la infraestructura (Postgres, WhatsApp API,
  LangGraph runtime).

  Testing: Runners reales instalados y verificados en ambos lados. Backend:
  pytest + pytest-asyncio + import-linter (mergeado a main via PR 1 de
  kureha-mvp). Frontend: Vitest + @testing-library/react + jsdom, via
  @vitejs/plugin-react (guia oficial de Next.js 16 para App Router), con
  `resolve.tsconfigPaths: true` nativo de Vite en vez del plugin
  `vite-tsconfig-paths`. Smoke test de frontend corrido y verificado en
  verde. Strict TDD activo desde este punto.

  Style: Documentacion SDD (proposal/spec/design/tasks) en espanol, igual que
  el resto del curso y la idea original. Codigo, identificadores, comentarios
  y mensajes de error en ingles (convencion global del usuario), salvo textos
  de cara al usuario final que el negocio pida en espanol.

  Regulatorio (no negociable):
  - Ley 29733: dato de salud es dato sensible, requiere consentimiento
    informado versionado.
  - RENHICE / HL7 FHIR PE-CORE: interoperabilidad progresiva obligatoria de
    historia clinica electronica (Decreto Supremo 020-2025-SA).
  - Reglamento de la Ley 31814: trazabilidad de decisiones automatizadas.
  - SUSALUD: puede sancionar incumplimiento — toda decision del agente debe
    quedar auditada.

rules:
  proposal:
    - Mantenerse alineado al contexto regulatorio y de negocio ya establecido
      en `openspec/` (Ley 29733, RENHICE/HL7 FHIR PE-CORE, Reglamento Ley 31814,
      SUSALUD) — no reinventar ese marco en cada propuesta.
    - Incluir plan de rollback para cualquier cambio que toque datos de
      pacientes o reglas de disponibilidad.
  specs:
    - Usar escenarios Given/When/Then.
    - Usar palabras clave RFC 2119 (MUST, SHALL, SHOULD, MAY).
    - Cubrir explicitamente como requisitos de primera clase (no como nota aparte).
      RLS por rol, consentimiento versionado, log de auditoria
      append-only, HITL obligatorio, y el validador de scope clinico (el
      agente nunca diagnostica).
  design:
    - Incluir diagramas de secuencia para los flujos de agendar, reprogramar,
      cancelar y escalar a humano.
    - Documentar cada decision de arquitectura con su razon (rationale),
      especialmente RLS, esquema de auditoria (append-only / hash-chain) y
      modelo de consentimiento versionado.
    - Definir el grafo LangGraph (nodos, edges, puntos de interrupt()) de
      forma explicita, no solo en prosa.
  tasks:
    - Agrupar por fase, numeracion jerarquica.
    - Cada tarea completable en una sola sesion.
    - RLS, consentimiento y logs de auditoria van en el MVP, no se dejan
      para "V2" — son el diferencial del proyecto.
  apply:
    - Seguir los patrones de codigo que se establezcan en design.md.
    - Strict TDD activo: test que falla primero, despues implementacion.
    tdd: true
    test_command: "cd backend && uv run pytest && cd ../frontend && npm run test"
  verify:
    test_command: "cd backend && uv run pytest && uv run lint-imports && cd ../frontend && npm run test"
    build_command: "cd frontend && npm run build"
    coverage_threshold: 0
  archive:
    - Advertir antes de fusionar deltas destructivos sobre specs/ ya
      existentes.

testing:
  runner: pytest (backend) + vitest (frontend)
  backend:
    runner: pytest + pytest-asyncio
    command: "uv run pytest"
    lint_command: "uv run lint-imports"
    layers: unit + integration (design.md §14 tiene la guia completa por capa: RLS, RBAC, consent, scope, HITL, confirmation gate, calendar sync, cifrado, staff/shifts, auditoria, rate limiting, thread_id ownership, Tony conversacional, sugerencias)
  frontend:
    runner: Vitest + @testing-library/react + jsdom
    command: "npm run test"
    watch_command: "npm run test:watch"
    config: frontend/vitest.config.ts
    note: >
      Setup oficial de Next.js 16 para App Router (@vitejs/plugin-react +
      jsdom); usa resolve.tsconfigPaths nativo de Vite en vez del plugin
      vite-tsconfig-paths (deprecado por el propio Vite). No incluye
      Playwright/E2E todavia — solo unit/component tests.
  strict_tdd: true
  reason: >
    Ambos runners existen, estan instalados y se verificaron corriendo en
    verde (backend: pytest via PR 1 de kureha-mvp; frontend: smoke test de
    Vitest sobre app/page.tsx). Activado 2026-07-13 a pedido explicito del
    usuario tras confirmar que faltaba el runner de frontend.
