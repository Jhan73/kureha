services:

  localstack:
    # Pinned, not `:latest` (task 16.5 finding): `:latest` currently
    # resolves to LocalStack 2026.7.0, which refuses to boot at all
    # ("License activation failed", exit code 55) without a valid
    # LOCALSTACK_AUTH_TOKEN -- even though every service this compose file
    # requests (secretsmanager/s3/sns/logs/cloudwatch) is Community-tier
    # (design.md §22.2's own table). This was a previously-documented but
    # never root-caused gotcha across PR 14/15 sessions ("exited (55), a
    # pre-existing local-environment issue") -- root-caused this session:
    # 3.8 boots cleanly with LOCALSTACK_AUTH_TOKEN="" and serves every
    # Community service this project uses. Bump deliberately, not blindly,
    # if a newer pinned version is ever needed.
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: secretsmanager,s3,sns,logs,cloudwatch
      DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: "" # Community edition; keep empty in CI too
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: kureha_dev
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_only_password # not a real secret
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d kureha_dev"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env.local
    volumes:
      - ./backend:/app
      # Anonymous volume: keeps the container's own (Linux) .venv built at
      # image time instead of letting the bind mount above shadow it with
      # the host's .venv (which may hold Windows/macOS binaries).
      - /app/.venv

volumes:
  localstack_data:
  postgres_data:
